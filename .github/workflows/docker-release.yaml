name: Publish Docker image

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag_output.outputs.tag }}

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      pull-requests: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Extract Docker tag from Git ref
        if: github.ref_type == 'tag'
        id: extract_tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update Chart.yaml appVersion
        if: github.ref_type == 'tag'
        run: |
          sed -i "s/^appVersion:.*/appVersion: \"${TAG}\"/" deploy/charts/gomenhashai/Chart.yaml
          sed -i "0,/^[[:space:]]*digest:/s|^\([[:space:]]*digest:\).*|\1 \"${DIGEST}\"|" deploy/charts/gomenhashai/values.yaml
        env:
          TAG: ${{ steps.extract_tag.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Set up Go
        if: github.ref_type == 'tag'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0

      - name: Install helm-docs
        if: github.ref_type == 'tag'
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2

      - name: Generate Helm chart documentation
        if: github.ref_type == 'tag'
        run: helm-docs

      # Create a Pull Request
      - name: Create Pull Request
        if: github.ref_type == 'tag'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          branch: update-chart-version-${{ steps.extract_tag.outputs.tag }}
          commit-message: Update appVersion to ${{ steps.extract_tag.outputs.tag }}
          delete-branch: true
          signoff: true
          sign-commits: true
          base: main
          title: "chore: update appVersion to ${{ steps.extract_tag.outputs.tag }}"
          body: |
            This PR updates the Helm chart appVersion to match the published Docker tag `${{ steps.extract_tag.outputs.tag }}` and also update the digest.

      - name: Prepare sigstore and in-toto bundle
        if: github.ref_type == 'tag'
        id: prep_attestation
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          NAME="${{ runner.temp }}/$(basename ${{ env.IMAGE_NAME}}-${{ steps.extract_tag.outputs.tag }})"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          mv "$BUNDLE" "${NAME}.sigstore"
          if ! jq -e '.dsseEnvelope' "${NAME}.sigstore" > /dev/null; then
            echo "❌ Error: No 'dsseEnvelope' found in ${NAME}.sigstore"
            exit 1
          fi

          jq -c '.dsseEnvelope' "${NAME}.sigstore" > "${NAME}.intoto.jsonl"
          echo "✅ Extracted dsseEnvelope to ${NAME}.intoto.jsonl"

      # Upload attestations
      - name: Upload attestations to release
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2
        if: github.ref_type == 'tag'
        with:
          file: ${{ steps.prep_attestation.outputs.name }}.*
          file_glob: true

      - name: Prepare tag output
        id: tag_output
        run: |
          tag="${{ steps.extract_tag.outputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1 | cut -d':' -f2)"
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT

  call-chart-test-workflow:
    needs: build-and-push-image
    uses: ./.github/workflows/chart-test.yaml
    with:
      image_tag: ${{ needs.build-and-push-image.outputs.image_tag }}
        
